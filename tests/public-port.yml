# A compose file that check-ports.sh must reject (MQTT public, as it was until 2026-11-18), while the
# gateway port next to it is allowed. CI expects the check to fail on it.
services:
  bridge:
    image: chirpstack/chirpstack-gateway-bridge:4
    ports:
      - "1700:1700/udp"
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
